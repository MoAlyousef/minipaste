[package]
name = "minipaste"
version = "0.1.0"
edition = "2021"
categories = ["development-tools"]
documentation = "https://docs.rs/minipaste"
description = "A minimal paste macro for Rust"
keywords = ["macros"]
license = "MIT"
repository = "https://github.com/MoAlyousef/minipaste"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
